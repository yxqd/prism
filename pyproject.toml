[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.1.0"
description = "Pipeline for Research Imaging & Scalable ML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "bokeh>=3.1.0",
    "dask[distributed]>=2024.1.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
    "webdataset>=0.2.0",
    "nvidia-dali-cuda120",
    "ray[default]",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "nvidia-ml-py>=11.0.0",
    "lmdb>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "moto[s3]>=4.2.0",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[tool.hatch.build.targets.wheel]
packages = ["prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
