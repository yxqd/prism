# Example pipeline config for: python scripts/run_workflow.py s3://... --pipeline config/pipeline.example.yaml
# Steps run in order. Use seed for reproducible randomness in augment / camera effects.

steps:
  - name: resize
    target_size: [224, 224]
    maintain_aspect: true
    pad: true
  - name: normalize
